<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sheet2Music</title>
  <link rel="stylesheet" href="style.css?v=step1-pdf-score" />
</head>
<body>
  <header class="topbar">
    <h1>Sheet2Music</h1>
      <p class="subtitle">PDF / MP3 → MIDI / MP3 · 本地音乐转换工作台</p>
  </header>

  <section id="system-panel" class="card system-panel">
    <h2 id="system-toggle" class="system-toggle" role="button" tabindex="0" aria-expanded="true">
      环境检查
      <span id="system-badge" class="badge"></span>
      <span class="caret">▾</span>
    </h2>
    <div id="system-body" class="system-body">
      <ul id="system-status" class="system-status"></ul>
      <div id="weights-section" class="weights-section" hidden>
        <div class="weights-actions">
          <button id="weights-download-btn" type="button">下载模型权重</button>
          <span id="weights-status" class="weights-status"></span>
        </div>
        <div id="weights-progress" class="progress-wrap" hidden>
          <div id="weights-progress-bar" class="progress-bar"></div>
        </div>
      </div>
    </div>
  </section>

  <main class="layout">
    <section class="left">
      <div id="drop-zone" class="drop-zone" role="button" tabindex="0" aria-label="上传 MP3 或 PDF">
        <p class="dz-title"><strong>推荐上传 MP3</strong>，节奏识别效果更佳</p>
        <p class="dz-fallback">PDF 琴谱作为备用输入，适合没有音频的情况</p>
        <p class="dz-action">把文件拖到这里，或点击选择文件</p>
        <button id="pick-file" type="button">选择文件</button>
        <input id="file-input" type="file" accept="application/pdf,.pdf,audio/mpeg,.mp3" hidden />
        <div class="url-upload">
          <label for="video-url">或粘贴 YouTube / Bilibili 视频 URL</label>
          <input id="video-url" type="url" placeholder="https://www.youtube.com/watch?v=..." />
          <button id="submit-video-url" type="button">使用视频音频</button>
        </div>
      </div>

      <div id="preview-area" class="card preview-area" hidden>
        <h2>首页预览</h2>
        <img id="preview-img" alt="乐谱首页预览" />
        <div id="file-meta" class="file-meta"></div>
      </div>
    </section>

    <section class="right">
      <div id="params-card" class="card">
        <h2>转换参数</h2>

        <label for="bpm">BPM <em id="bpm-hint">（PDF 必填；MP3 由 Beat This 检测）</em></label>
        <input id="bpm" type="number" min="1" step="1" placeholder="例如 120" disabled />

        <label for="time-signature">拍号</label>
        <input id="time-signature" type="text" value="4/4" disabled />

        <label class="checkbox gpu-option">
          <input id="use-gpu" type="checkbox" disabled />
          使用 GPU 加速（要求 CUDA 会话可用）
        </label>

        <label for="transkun-model">Transkun 模型</label>
        <select id="transkun-model" disabled>
          <option value="v2" selected>Transkun V2（参考兼容，默认）</option>
          <option value="v2_aug">Transkun V2 Aug</option>
        </select>

        <label class="checkbox">
          <input id="has-pickup-measure" type="checkbox" disabled />
          开头有弱起小节（印刷编号从后续小节开始）
        </label>

        <fieldset id="outputs" disabled>
          <legend>输出格式</legend>
          <label class="checkbox"><input type="checkbox" value="musicxml" checked /> MusicXML</label>
          <label class="checkbox"><input type="checkbox" value="midi" checked /> MIDI</label>
          <label class="checkbox"><input type="checkbox" value="mp3" /> MP3</label>
          <label class="checkbox"><input type="checkbox" value="zip" /> ZIP 打包</label>
        </fieldset>

        <label id="piano-score-output" class="checkbox" hidden>
          <input id="generate-pdf" type="checkbox" disabled />
          同时生成钢琴谱 PDF
        </label>

        <div class="actions">
          <button id="convert-btn" class="primary" disabled>开始转换</button>
          <button id="reset-btn" class="secondary" disabled>下一份乐谱</button>
        </div>
      </div>

      <div id="progress" class="card" hidden>
        <h2>转换进度</h2>
        <ol id="stages" class="stages"></ol>
        <div id="error-box" class="error" hidden></div>
      </div>

      <div id="review-panel" class="card review-panel" hidden>
        <div class="review-heading">
          <div>
            <h2>需要人工审查</h2>
            <p id="review-summary" class="summary"></p>
            <div id="review-changes" class="review-changes" hidden></div>
          </div>
          <span class="review-badge">高风险</span>
        </div>
        <section id="auto-review" class="auto-review" hidden>
          <div id="auto-review-summary" class="auto-review-summary"></div>
          <details id="auto-resolved-audit" class="auto-resolved-audit" hidden>
            <summary>查看自动解决记录</summary>
            <div id="auto-resolved-list" class="auto-resolved-list"></div>
          </details>
          <div id="auto-review-batches" class="auto-review-batches"></div>
        </section>
        <div id="review-bulk-actions" class="review-bulk-actions">
          <button id="review-preserve-all-btn" class="secondary" type="button">批量保留可保留变化</button>
          <button id="review-apply-suggestions-btn" class="secondary" type="button">一键采用可用修复</button>
          <button id="review-ignore-all-btn" class="secondary" type="button">一键忽略全部疑点</button>
          <span id="review-selection-status" class="review-selection-status"></span>
        </div>
        <div id="review-findings" class="review-findings"></div>
        <div class="review-footer">
          <button id="approve-review-btn" class="primary" type="button" disabled>提交审批</button>
          <span id="review-status" class="review-status"></span>
        </div>
      </div>

      <div id="results" class="card" hidden>
        <h2>转换结果</h2>
        <p id="summary" class="summary"></p>
        <div id="warnings" class="warnings" hidden></div>
        <div id="downloads" class="downloads"></div>
      </div>
    </section>
  </main>

  <script src="review-state.js?v=7"></script>
  <script src="job-session.js"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
